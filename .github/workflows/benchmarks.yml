name: Benchmarks

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "gestalt-rust-bench"
          cache-on-failure: true

      - name: Run Benchmarks
        run: |
          cargo bench -p gestalt_core --bench core_bench

      - name: Benchmark Summary
        if: always()
        run: |
          echo "### Benchmark Results" > bench_summary.txt
          echo "Core benchmarks completed successfully." >> bench_summary.txt
          cat bench_summary.txt
