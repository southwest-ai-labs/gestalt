[workspace]
members = [
    "gestalt_core",
    "gestalt_cli",
    "gestalt_mcp",
    "synapse-agentic",
    "gestalt-router",
    "gestalt-merge",
    "gestalt-state",
    "gestalt-ws",
    "gestalt-search",
    "gestalt-proto",
    "gestalt-wasm",
    "gestalt_acp",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "deny"
dead_code = "allow"

[workspace.lints.clippy]
too_many_arguments = { level = "warn", priority = -1 }
let_and_return = { level = "warn", priority = -1 }

[workspace.dependencies]
# Workspace crates
gestalt_core = { path = "gestalt_core" }
synapse-agentic = { path = "synapse-agentic" }
gestalt-router = { path = "gestalt-router" }
gestalt_router = { path = "gestalt-router", package = "gestalt-router" }
gestalt-merge = { path = "gestalt-merge" }
gestalt_merge = { path = "gestalt-merge", package = "gestalt-merge" }
gestalt-state = { path = "gestalt-state" }
gestalt_state = { path = "gestalt-state", package = "gestalt-state" }
gestalt-ws = { path = "gestalt-ws" }
gestalt_ws = { path = "gestalt-ws", package = "gestalt-ws" }
gestalt-search = { path = "gestalt-search" }
gestalt_search = { path = "gestalt-search", package = "gestalt-search" }
gestalt-proto = { path = "gestalt-proto" }
gestalt_proto = { path = "gestalt-proto", package = "gestalt-proto" }
gestalt-wasm = { path = "gestalt-wasm" }
gestalt_wasm = { path = "gestalt-wasm", package = "gestalt-wasm" }
gestalt_acp = { path = "gestalt_acp" }
gestalt-acp = { path = "gestalt_acp", package = "gestalt_acp" }
gestalt_mcp = { path = "gestalt_mcp" }
gestalt-mcp = { path = "gestalt_mcp", package = "gestalt_mcp" }

# Unified external dependencies
thiserror = "2"
dashmap = "6"
tokio = { version = "1.49", features = ["full"] }
uuid = { version = "1.15", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
git2 = "0.20"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }

# Common workspace dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
mcp-protocol-sdk = "0.5.1"
futures-util = "0.3"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tempfile = "3.24"
chrono = { version = "0.4", features = ["serde"] }
tokio-tungstenite = "0.30"
tokio-util = "0.7"
sha2 = "0.10"
subtle = "2.6"
ignore = "0.4"
config = "0.15"
toml = "1.1"
libc = "0.2"
dirs = "6.0"

[profile.dev-fast]
inherits = "dev"
debug = 0
incremental = true
codegen-units = 256

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
