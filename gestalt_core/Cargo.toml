[package]
name = "gestalt_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
ui-bridge = ["dep:flutter_rust_bridge"]

[dependencies]
# Async Runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Networking & Auth
reqwest = { workspace = true, features = ["stream", "multipart"] }
oauth2 = "5.0.0"

# Interop
flutter_rust_bridge = { version = "=2.12.0", optional = true }

# Error Handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Git
git2 = { workspace = true }

# OAuth2 helpers
dirs = { workspace = true }
chrono = { workspace = true }
url = "2.5.4"
open = "5.3.3"

# PKCE helpers
sha2 = { workspace = true }
base64 = "0.23.1"
rand = "0.10.2"
uuid = { workspace = true }
mcp-protocol-sdk = { workspace = true }
walkdir = "2.5.0"
ignore = { workspace = true }
config = { workspace = true }
tempfile = { workspace = true }

# Database
rusqlite = { workspace = true }
sqlite-vec = "0.1"

synapse-agentic = { workspace = true }

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "core_bench"
harness = false

[[bench]]
name = "bench_main"
harness = false

