[package]
name = "gestalt_mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Gestalt standalone MCP server — exposes Gestalt tools via the Model Context Protocol (HTTP/SSE + stdio)"

[[bin]]
name = "gestalt_mcp"
path = "src/main.rs"

[lib]
name = "gestalt_mcp"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
gestalt_core = { workspace = true }
gestalt_search = { workspace = true }
gestalt-state = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# MCP protocol
mcp-protocol-sdk = { workspace = true, features = ["http", "stdio"] }

# CLI
clap = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# File system
ignore = { workspace = true }

# Lazy statics (task store)
lazy_static = "1.5"

# UUID (instance id)
uuid = { workspace = true }

# Error handling
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
